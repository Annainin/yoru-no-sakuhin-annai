<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品を探す｜夜の作品案内所</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="wrap header-inner"><a class="logo" href="index.html">夜の<span>作品案内所</span></a><nav class="main-nav"><a href="index.html">ホーム</a><a class="active" href="search.html">作品を探す</a><a href="actors.html">女優</a><a href="ranking.html">ランキング</a><a href="genre.html">ジャンル</a></nav></div></header><main class="wrap"><section class="hero"><h1>作品を探す</h1><form class="search" id="searchForm"><input id="q" name="q" placeholder="作品・女優・メーカー・キーワード"><button type="submit" class="btn gold">検索</button></form></section><section class="result-heading"><span class="result-label">現在の表示</span><h2 id="resultTitle">作品一覧</h2></section><section class="section"><div class="section-head"><h2>絞り込み</h2></div><div class="chips"><a class="chip" href="genre.html">ジャンル</a><a class="chip" href="actors.html">女優</a><a class="chip" href="search.html?type=maker">メーカー</a><a class="chip" href="search.html?sort=new">新着</a><a class="chip" href="ranking.html">ランキング</a></div></section><section class="section"><div class="section-head"><h2 id="listTitle">作品一覧</h2><a href="search.html?sort=new">新着順</a></div><div class="work-grid" id="workGrid"></div></section></main><footer class="footer"><div class="wrap">© 夜の作品案内所</div></footer><script>
const works=[
 {title:'作品サンプル 01',genre:['巨乳','独占配信'],actor:'女優サンプル A',maker:'メーカーサンプル 01',tags:'人気 新着'},
 {title:'作品サンプル 02',genre:['美乳','ドラマ'],actor:'女優サンプル B',maker:'メーカーサンプル 02',tags:'人気'},
 {title:'作品サンプル 03',genre:['スレンダー','ハイビジョン'],actor:'女優サンプル C',maker:'メーカーサンプル 01',tags:'新着'},
 {title:'作品サンプル 04',genre:['人妻・主婦','NTR'],actor:'女優サンプル D',maker:'メーカーサンプル 03',tags:'人気'},
 {title:'作品サンプル 05',genre:['熟女','企画'],actor:'女優サンプル E',maker:'メーカーサンプル 02',tags:'新着'},
 {title:'作品サンプル 06',genre:['素人','4K'],actor:'女優サンプル F',maker:'メーカーサンプル 04',tags:'人気 新着'}
];
const p=new URLSearchParams(location.search), q=(p.get('q')||'').trim(), genre=p.get('genre')||'', actor=p.get('actor')||'', type=p.get('type')||'', sort=p.get('sort')||'';
let filtered=works.filter(w=>{const text=[w.title,w.actor,w.maker,...w.genre,w.tags].join(' '); if(q&&!text.toLowerCase().includes(q.toLowerCase())) return false; if(genre&&!w.genre.includes(genre)) return false; if(actor&&w.actor!==decodeURIComponent(actor)) return false; if(type==='maker'&&q&&!w.maker.includes(q)) return false; return true;});
if(sort==='new') filtered=[...filtered].sort((a,b)=>a.tags.includes('新着')? -1 : b.tags.includes('新着')? 1:0);
let title='作品一覧';
if(q) title='検索：'+q; else if(genre) title='ジャンル：'+genre; else if(actor) title='女優：'+decodeURIComponent(actor); else if(type==='maker') title='メーカーから探す'; else if(sort==='new') title='新着作品';
document.title=title+'｜夜の作品案内所'; document.getElementById('resultTitle').textContent=title; document.getElementById('listTitle').textContent=title;
document.getElementById('q').value=q;
document.getElementById('workGrid').innerHTML=filtered.length?filtered.map(w=>`<a class="work" href="detail.html"><div class="tag">SAMPLE WORK</div><h3>${w.title}</h3><p>${w.genre.join(' ・ ')}</p><small>${w.actor} ・ ${w.maker}</small></a>`).join(''):'<div class="notice">該当する作品はありません。</div>';
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault(); const value=document.getElementById('q').value.trim(); location.href=value?'search.html?q='+encodeURIComponent(value):'search.html';});
</script></body></html>
